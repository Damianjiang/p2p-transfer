<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Transfer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>P2P</h1>
            </div>
            
            <div class="tab-bar">
                <button class="tab active" data-tab="host">Host</button>
                <button class="tab" data-tab="connect">Connect</button>
            </div>
            
            <div class="form">
                <div class="field">
                    <label>Name</label>
                    <input type="text" id="username" placeholder="Username">
                </div>
                
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>
                
                <div class="field host-only">
                    <label>Port</label>
                    <input type="number" id="port" value="8888" min="1024" max="65535">
                </div>
                
                <div class="field connect-only" style="display:none">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="192.168.1.100">
                </div>
            </div>
            
            <div class="action">
                <button class="btn primary" id="actionBtn">Connect</button>
            </div>
        </div>
        
        <div class="main">
            <div class="drop-zone" id="dropZone">
                <div class="drop-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Drop files here</p>
                </div>
            </div>
            
            <div class="chat">
                <div class="chat-header">
                    <span>Messages</span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-wrapper">
                    <input type="text" id="chatInput" placeholder="Message" disabled>
                    <button id="sendBtn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
