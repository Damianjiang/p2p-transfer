<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>
  
  <g transform="translate(256, 256)" filter="url(#glow)">
    <circle cx="-60" cy="-30" r="40" fill="white" opacity="0.95"/>
    <circle cx="60" cy="-30" r="40" fill="white" opacity="0.95"/>
    <circle cx="0" cy="70" r="40" fill="white" opacity="0.95"/>
    
    <line x1="-25" y1="-5" x2="25" y2="45" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="25" y1="-5" x2="-25" y2="45" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">P2P</text>
</svg>
